<html lang="es">

  <!-- Google Fonts | lato & poppins fonts -->
  <link href="https://fonts.googleapis.com/css?family=Lato|Poppins" rel="stylesheet">
  <!-- Main Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/styleContacto.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar_di-buffala">
        <div class="container-fluid">
        <!-- Brand and toggle get grouped for better mobile display -->
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="index.html">
            <img src="assets/img/logo.png" alt="Logo Di Buffala">
            </a>
        </div>

        <!-- Collect the nav links, forms, and other content for toggling -->
        <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
            <ul class="nav navbar-nav navbar-right navbar__navigation">
            <li><a href="#">Trabajo</a></li>
            <li><a href="#">Características</a></li>
            <li><a href="#">Blog</a></li>
            <li><a href="contacto.html">Contacto</a></li>
            </ul>
        </div><!-- /.navbar-collapse -->

        </div><!-- /.container-fluid -->
    </nav>

    <div class="container">
        <!-- Formulario de contacto -->
        <section class="container-fluid contacto padding-contacto">
            <div class="row">
            <div class="col-md-6 col-md-offset-3">
                <h2>Contacto</h2>
                <form action="#" method="post">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" class="form-control" id="nombre" name="nombre">
                    </div>
                    <div class="form-group">
                        <label for="email">Email:</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="mensaje">Mensaje:</label>
                        <textarea class="form-control" id="mensaje" name="mensaje"></textarea>
                    </div>
                    <div class="form-group text-center">
                        <button type="submit" class="btn button_di-buffala">Enviar mensaje</button>
                    </div>
                </form>
            </div>
            </div>
        </section>  
    </div>
    
    <!-- Footer -->
    <footer class="footer_di-buffala">
        <small>DiBufalla 2018. Todos los derechos reservados.</small>
    </footer>

    <!-- jquery -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.js" integrity="sha256-fNXJFIlca05BIO2Y5zh1xrShK3ME+/lYZ0j+ChxX2DA=" crossorigin="anonymous"></script>

    <!-- Font Awesome 5 -->

    <!-- Main scripts -->
    <script src="assets/js/script.js"></script>
</body>
</html>
